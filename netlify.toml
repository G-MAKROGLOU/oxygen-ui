[build]
  command   = "node scripts/generate-ai-manifest.mjs && yarn build-storybook"
  publish   = "storybook-static"

[build.environment]
  NODE_VERSION = "24"

[build.processing]
  skip_processing = false

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# Route /mcp to the MCP function (belt-and-suspenders alongside config.path in the function)
[[redirects]]
  from   = "/mcp"
  to     = "/.netlify/functions/mcp"
  status = 200
